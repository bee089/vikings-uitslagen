<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vikings Hardenberg | Wedstrijdoverzicht</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#071d3d;color:white}#screen{height:100dvh;padding:5vh 6vw 3vh;display:grid;grid-template-rows:20vh .7vh 1fr 5vh;row-gap:2vh;background:radial-gradient(circle at 80% 50%,rgba(0,151,215,.18),transparent 38%),linear-gradient(115deg,#061a38,#093967 55%,#087eac)}header{display:flex;justify-content:space-between;align-items:flex-start}.heading{font-size:6.5vh;line-height:.95;font-weight:900;letter-spacing:.04em}.heading strong{display:block;color:#ffd21c;margin-top:2.5vh}.brand{text-align:right;font-weight:900;letter-spacing:.08em;font-size:2.2vh;line-height:1.35}.line{background:#ffd21c}.center{display:flex;justify-content:center;align-items:center;min-height:0}.matches{width:74vw;height:48vh;display:grid;gap:1vh}.match{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 15vw minmax(0,1fr);gap:2vw;align-items:center;padding:0 2vw;background:rgba(3,24,55,.58);border:1px solid rgba(255,255,255,.08);border-radius:1vh}.team{min-width:0;overflow:hidden}.home{text-align:right}.org{font-size:1.3vh;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.6vh}.name{font-size:2.5vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vikings .org{color:rgba(255,210,28,.78)}.vikings .name{color:#ffd21c;font-weight:900}.moment{padding:1.2vh .5vw;border-radius:.8vh;background:linear-gradient(135deg,rgba(0,80,180,.9),rgba(0,125,215,.82));text-align:center;font-size:2.5vh;font-weight:900;white-space:nowrap}.moment small{display:block;color:#ffd21c;font-size:1.55vh;margin-bottom:.4vh}.footer{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.82);font-size:1.35vh}.message{font-size:2.6vh;font-weight:700;text-align:center}.pager{color:#ffd21c}@media(max-aspect-ratio:16/9){.matches{width:80vw}.name{font-size:2.1vh}}
</style></head><body><div id="screen"><header><div class="heading">KOMENDE<strong>WEDSTRIJDEN</strong></div><div class="brand">VIKINGS<br>HARDENBERG</div></header><div class="line"></div><main class="center"><div id="matches" class="matches"><div class="message">Programma laden...</div></div></main><footer class="footer"><span>BV VIKINGS HARDENBERG</span><span id="period"></span><span class="pager" id="pager"></span></footer></div><script>
const CLUB='b096fce6-238c-4f01-8cb9-1ef2fe6e47a0';let matches=[],page=0;
const clean=s=>String(s||'').replace(/\*+/g,'').trim();const date=s=>String(s||'').slice(0,10);
function team(m,home){const org=home?m.homeOrganisation:m.awayOrganisation;const is=org?.id===CLUB;let name=clean(home?m.homeTeamName:m.awayTeamName);if(is)name=name.replace(/^BV Vikings\s*/i,'');else if(org?.name&&name.toLowerCase().startsWith(clean(org.name).toLowerCase()))name=name.slice(clean(org.name).length).trim();return {org:is?'BV VIKINGS HARDENBERG':clean(org?.name),name,is};}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function teamEl(m,home){const t=team(m,home),n=el('div','team '+(home?'home':'away')+(t.is?' vikings':''));n.append(el('div','org',t.org),el('div','name',t.name));return n;}
function render(){const root=document.getElementById('matches');root.replaceChildren();if(!matches.length){root.append(el('div','message','Geen wedstrijden deze week'));return;}const chunk=matches.slice(page*5,page*5+5);root.style.gridTemplateRows=`repeat(${chunk.length},1fr)`;for(const m of chunk){const row=el('div','match');const moment=el('div','moment');const d=new Date(date(m.date)+'T12:00:00Z');moment.append(el('small','',new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).format(d).toUpperCase()),el('div','',String(m.startTime||'--:--').slice(0,5)));row.append(teamEl(m,true),moment,teamEl(m,false));root.append(row);}document.getElementById('pager').textContent=matches.length>5?`${page+1} / ${Math.ceil(matches.length/5)}`:'';}
async function load(){try{const res=await fetch('./wedstrijden.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error(res.status);const data=await res.json();matches=data.matches||[];page=0;document.getElementById('period').textContent=`${data.start} t/m ${data.end}`;render();}catch(e){console.error(e);document.getElementById('matches').replaceChildren(el('div','message','Programma niet beschikbaar'));}}
load();setInterval(()=>{if(matches.length>5){page=(page+1)%Math.ceil(matches.length/5);render()}},12000);setInterval(load,15*60*1000);
</script></body></html>
