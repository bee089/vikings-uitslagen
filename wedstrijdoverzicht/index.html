<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vikings | Wedstrijdoverzicht</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#001f4c;color:#fff;font-family:Arial,Helvetica,sans-serif}
#screen{position:relative;width:100vw;height:100vh;overflow:hidden;background:#001f4c url('./achtergrond.png') center/100% 100% no-repeat}
/* Het paneel blijft helemaal onderaan en maskeert vaste regels in de achtergrondposter. */
#board{position:absolute;left:7%;right:7%;bottom:1.7%;height:64%;padding:1.2vh 1.4vw 1.5vh;background:linear-gradient(145deg,rgba(0,24,61,.96),rgba(0,42,94,.96));border:2px solid rgba(255,255,255,.15);border-radius:1.2vh;box-shadow:0 .5vh 2vh rgba(0,0,0,.36);display:flex;flex-direction:column;justify-content:flex-end}
#matches{display:flex;flex-direction:column;justify-content:flex-end;gap:.8vh;min-height:0;width:100%}
.day-group{display:flex;flex-direction:column;gap:.65vh;min-height:0}
.day-heading{align-self:stretch;padding:.38vh 1vw;background:linear-gradient(90deg,#ffd300,#f1b900);color:#001f4c;text-align:center;font-size:clamp(16px,2.25vh,33px);font-weight:900;letter-spacing:.055em;border-radius:.6vh;text-transform:uppercase;line-height:1.2}
.match{min-height:0;height:8vh;display:grid;grid-template-columns:minmax(0,1fr) 12.5vw minmax(0,1fr);column-gap:1.6vw;align-items:center;padding:.4vh 1.6vw;background:rgba(0,25,65,.84);border:2px solid rgba(255,255,255,.18);border-radius:1.2vh;box-shadow:0 .35vh 1.2vh rgba(0,0,0,.25)}
.team{min-width:0;display:flex;align-items:center;gap:.7vw}.team.home{justify-content:flex-end;text-align:right}.team.away{justify-content:flex-start;text-align:left}
.team-text{min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.05}.org{color:rgba(255,255,255,.72);font-size:clamp(11px,1.6vh,23px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team-name{color:#fff;font-size:clamp(15px,2.7vh,39px);font-weight:900;margin-top:.35vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.vikings .org,.team.vikings .team-name{color:#ffd300}.logo{height:5.2vh;width:5.2vh;object-fit:contain;flex:none;display:none}
.time{width:100%;padding:1.35vh .35vw;text-align:center;color:#fff;font-size:clamp(19px,3.6vh,51px);line-height:1;font-weight:900;background:linear-gradient(135deg,rgba(0,86,190,.98),rgba(0,145,225,.95));border-radius:1vh;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.message{text-align:center;font-size:3.2vh;font-weight:800;padding:3vh;background:rgba(0,25,65,.78);border-radius:1.2vh}.pager{position:absolute;right:1.3vw;bottom:.3vh;font-size:1.3vh;color:rgba(255,255,255,.65)}
@media(max-aspect-ratio:1/1){#board{left:3%;right:3%}.match{grid-template-columns:minmax(0,1fr) 17vw minmax(0,1fr)}.org{font-size:1.6vw}.team-name{font-size:2.2vw}.time{font-size:3vw}}
</style></head><body><div id="screen"><section id="board"><div id="matches" aria-live="polite"><div class="message">Programma laden...</div></div><span class="pager" id="pager"></span></section></div>
<script>
const CLUB='b096fce6-238c-4f01-8cb9-1ef2fe6e47a0';
const LOGOS={
  'bv vikings':'https://images.foys.io/foys/b096fce6-238c-4f01-8cb9-1ef2fe6e47a0/750058899184FEBDCC29F66D13DC8AF1.png?w=200',
  'the jugglers':'jugglers.png',
  'ebv the jugglers':'jugglers.png',
  'ebv mustangs':'mustangs.png',
  'twente buzzards':'buzzards.png',
  'amical':'amical.png'
};
const PER_PAGE=5,SWITCH_MS=12000;let matches=[],pages=[],page=0;
const clean=s=>String(s??'').replace(/\*+/g,'').trim();
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function team(m,home){const org=home?m.homeOrganisation:m.awayOrganisation;const is=org?.id===CLUB;const full=clean(home?m.homeTeamName:m.awayTeamName);let organisation=is?'BV Vikings':clean(org?.name);if(!organisation){const p=full.match(/^(BV Vikings|[^ ]+(?: [^ ]+)?)/);organisation=p?.[1]||full;}let name=full;if(name.toLowerCase().startsWith(organisation.toLowerCase()))name=name.slice(organisation.length).trim();return {organisation,name};}
function teamEl(m,home){const t=team(m,home),wrap=el('div','team '+(home?'home':'away')+(t.organisation.toLowerCase().includes('vikings')?' vikings':''));const key=t.organisation.toLowerCase().replace(/\s+/g,' ');const logo=(key.includes('vikings') || /^bv\s+vikings\b/i.test(clean(home?m.homeTeamName:m.awayTeamName)))?LOGOS['bv vikings']:LOGOS[key];if(logo){const img=el('img','logo');img.src=logo.startsWith('https://')?logo:'./logos/'+logo;img.alt='';img.onload=()=>{img.style.display='block'};img.onerror=()=>img.remove();wrap.append(img);}const words=el('div','team-text');words.append(el('div','org',t.organisation),el('div','team-name',t.name));if(home){wrap.prepend(words);}else{wrap.append(words);}return wrap;}
function formatDate(s){const d=new Date(String(s).slice(0,10)+'T12:00:00Z');return new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(d).toUpperCase();}
function paginate(list){const out=[];let current=[],day='';for(const m of list){const d=String(m.date).slice(0,10);if(current.length===PER_PAGE){out.push(current);current=[];day='';}current.push(m);day=d;}if(current.length)out.push(current);return out;}
function render(){const box=document.getElementById('matches');box.replaceChildren();if(!matches.length){box.append(el('div','message','Geen wedstrijden deze week'));document.getElementById('pager').textContent='';return;}const part=pages[page]||[];let group=null,prev='';for(const m of part){const date=String(m.date).slice(0,10);if(date!==prev){group=el('div','day-group');group.append(el('div','day-heading',formatDate(date)));box.append(group);prev=date;}const row=el('div','match');row.append(teamEl(m,true),el('div','time',clean(m.startTime).slice(0,5)||'--:--'),teamEl(m,false));group.append(row);}document.getElementById('pager').textContent=pages.length>1?`${page+1} / ${pages.length}`:'';}
async function load(){try{const r=await fetch('./wedstrijden.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();matches=(data.matches||[]).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.startTime).localeCompare(String(b.startTime)));pages=paginate(matches);page=0;render();}catch(e){console.error(e);document.getElementById('matches').replaceChildren(el('div','message','Programma tijdelijk niet beschikbaar'));}}
load();setInterval(()=>{if(pages.length>1){page=(page+1)%pages.length;render();}},SWITCH_MS);setInterval(load,15*60*1000);
</script></body></html>
