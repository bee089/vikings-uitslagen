<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vikings Hardenberg - Laatste uitslagen</title>

<style>

/* =========================================================
   BASIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    background: #071d3d;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   VOLLEDIG SCHERM
   ========================================================= */

#vikings-screen {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    padding:
        5vh
        6vw
        3vh
        6vw;

    background:

        radial-gradient(
            circle at 80% 50%,
            rgba(0,151,215,0.18),
            transparent 38%
        ),

        linear-gradient(
            115deg,
            #061a38 0%,
            #093967 55%,
            #087eac 100%
        );

    color: #ffffff;

    display: grid;

    grid-template-rows:
        20vh
        0.7vh
        1fr
        5vh;

    row-gap: 2vh;
}


/* =========================================================
   HEADER
   ========================================================= */

.vk-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;
}


.vk-heading {

    font-weight: 900;

    line-height: 0.9;
}


.vk-last {

    color: #ffffff;

    font-size: 6.5vh;

    letter-spacing:
        0.04em;
}


.vk-results-title {

    color: #ffd21c;

    font-size: 6.5vh;

    letter-spacing:
        0.04em;

    margin-top:
        2.5vh;
}


.vk-name {

    margin-top:
        0.5vh;

    color: #ffffff;

    text-align:
        right;

    font-size:
        2.2vh;

    line-height:
        1.35;

    font-weight:
        900;

    letter-spacing:
        0.08em;
}


/* =========================================================
   GELE LIJN
   ========================================================= */

.vk-line {

    width: 100%;

    height:
        0.7vh;

    background:
        #ffd21c;
}


/* =========================================================
   MIDDENGEBIED
   ========================================================= */

.vk-center {

    min-height: 0;

    display: flex;

    justify-content:
        center;

    align-items:
        center;
}


/* =========================================================
   RESULTATENBLOK
   ========================================================= */

#vk-results {

    width:
        74vw;

    max-width:
        1450px;

    height:
        48vh;

    max-height:
        560px;

    display: grid;

    grid-template-rows:
        repeat(5, 1fr);

    gap:
        1vh;
}


/* =========================================================
   WEDSTRIJD
   ========================================================= */

.vk-match {

    width: 100%;

    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        15vw
        minmax(0, 1fr);

    column-gap:
        2vw;

    align-items:
        center;

    padding:
        0
        2vw;

    background:
        rgba(3,24,55,0.58);

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius:
        1vh;
}


/* =========================================================
   TEAMVAK
   ========================================================= */

.vk-team {

    min-width: 0;

    display: flex;

    flex-direction:
        column;

    justify-content:
        center;

    overflow:
        hidden;
}


.vk-home {

    align-items:
        flex-end;

    text-align:
        right;
}


.vk-away {

    align-items:
        flex-start;

    text-align:
        left;
}


/* =========================================================
   CLUBNAAM
   ========================================================= */

.vk-org {

    width: 100%;

    margin-bottom:
        0.6vh;

    color:
        rgba(255,255,255,0.62);

    font-size:
        1.3vh;

    line-height:
        1;

    font-weight:
        600;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


/* =========================================================
   TEAMNAAM
   ========================================================= */

.vk-team-name {

    width: 100%;

    color:
        #ffffff;

    font-size:
        2.5vh;

    line-height:
        1;

    font-weight:
        800;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


/* =========================================================
   VIKINGS IN GEEL
   ========================================================= */

.vk-vikings .vk-org {

    color:
        rgba(255,210,28,0.78);
}


.vk-vikings .vk-team-name {

    color:
        #ffd21c;

    font-weight:
        900;
}


/* =========================================================
   SCORE
   ========================================================= */

.vk-score {

    width: 100%;

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:
        center;

    padding:
        1.4vh
        0.8vw;

    background:

        linear-gradient(
            135deg,
            rgba(0,80,180,0.90),
            rgba(0,125,215,0.82)
        );

    border-radius:
        0.8vh;

    color:
        #ffffff;

    font-size:
        3.4vh;

    line-height:
        1;

    font-weight:
        900;

    white-space:
        nowrap;

    box-shadow:
        0
        0.4vh
        1.5vh
        rgba(0,0,0,0.15);
}


.vk-home-score {

    text-align:
        right;
}


.vk-away-score {

    text-align:
        left;
}


.vk-dash {

    padding:
        0
        0.8vw;

    color:
        #ffd21c;

    font-size:
        2.8vh;
}


/* =========================================================
   FOOTER
   ========================================================= */

.vk-footer {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    color:
        rgba(255,255,255,0.82);

    font-size:
        1.35vh;

    line-height:
        1;

    letter-spacing:
        0.03em;

    white-space:
        nowrap;
}


/* =========================================================
   MELDING
   ========================================================= */

.vk-message {

    grid-row:
        1 / 6;

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    color:
        #ffffff;

    font-size:
        2.6vh;

    font-weight:
        700;
}


/* =========================================================
   SMALLERE SCHERMEN
   ========================================================= */

@media (max-aspect-ratio: 16/9) {

    #vk-results {

        width:
            78vw;
    }

    .vk-team-name {

        font-size:
            2.3vh;
    }

    .vk-score {

        font-size:
            3.1vh;
    }
}

</style>

</head>


<body>


<div id="vikings-screen">


    <!-- HEADER -->

    <header class="vk-header">


        <div class="vk-heading">

            <div class="vk-last">
                LAATSTE
            </div>

            <div class="vk-results-title">
                UITSLAGEN
            </div>

        </div>


        <div class="vk-name">

            VIKINGS<br>
            HARDENBERG

        </div>


    </header>


    <!-- GELE LIJN -->

    <div class="vk-line"></div>


    <!-- RESULTATEN -->

    <main class="vk-center">


        <div id="vk-results">


            <div class="vk-message">

                Uitslagen laden...

            </div>


        </div>


    </main>


    <!-- FOOTER -->

    <footer class="vk-footer">


        <span>

            BV VIKINGS HARDENBERG

        </span>


        <span id="vk-updated"></span>


    </footer>


</div>



<script>

(function () {


    /* =====================================================
       INSTELLINGEN
       ===================================================== */


    const CLUB_ID =
        "b096fce6-238c-4f01-8cb9-1ef2fe6e47a0";


    const FEDERATION_ID =
        "52cfa65e-9782-4a81-ab35-e2f981fcb7a9";


    const API =
        "https://api.foys.io/competition/public-api/v1/matches";


    /*
       Iedere 15 minuten opnieuw controleren.
    */

    const UPDATE_INTERVAL =
        15 * 60 * 1000;



    /* =====================================================
       DATUM VAN VANDAAG
       ===================================================== */


    function vandaag() {


        const delen =

            new Intl.DateTimeFormat(

                "en-CA",

                {

                    timeZone:
                        "Europe/Amsterdam",

                    year:
                        "numeric",

                    month:
                        "2-digit",

                    day:
                        "2-digit"
                }

            )

            .formatToParts(

                new Date()

            );


        const datum = {};


        delen.forEach(

            function (deel) {

                datum[deel.type] =
                    deel.value;

            }

        );


        return (

            datum.year +

            "-" +

            datum.month +

            "-" +

            datum.day

        );

    }



    /* =====================================================
       TEKST OPSCHONEN
       ===================================================== */


    function schoon(tekst) {


        return (

            tekst || ""

        )

        .replace(

            /\*+/g,

            ""

        )

        .trim();

    }



    /* =====================================================
       ORGANISATIE OPHALEN
       ===================================================== */


    function organisatie(

        match,

        thuis

    ) {


        return thuis

            ? match.homeOrganisation

            : match.awayOrganisation;

    }



    /* =====================================================
       VIKINGS HERKENNEN
       ===================================================== */


    function isVikings(

        match,

        thuis

    ) {


        const org =

            organisatie(

                match,

                thuis

            );


        return !!(

            org &&

            org.id === CLUB_ID

        );

    }



    /* =====================================================
       CLUBNAAM
       ===================================================== */


    function clubNaam(

        match,

        thuis

    ) {


        const org =

            organisatie(

                match,

                thuis

            );


        if (

            isVikings(

                match,

                thuis

            )

        ) {


            return (

                "BV VIKINGS HARDENBERG"

            );

        }


        if (

            org &&

            org.name

        ) {


            return schoon(

                org.name

            );

        }


        return "";

    }



    /* =====================================================
       TEAMNAAM
       ===================================================== */


    function teamNaam(

        match,

        thuis

    ) {


        let naam =

            schoon(

                thuis

                    ? match.homeTeamName

                    : match.awayTeamName

            );


        const org =

            organisatie(

                match,

                thuis

            );


        /*
           Bij Vikings:

           BV Vikings M18-1

           wordt:

           M18-1
        */


        if (

            isVikings(

                match,

                thuis

            )

        ) {


            naam =

                naam.replace(

                    /^BV Vikings\s*/i,

                    ""

                );


            return naam;

        }



        /*
           Bij tegenstanders verwijderen we
           de clubnaam uit de teamnaam als
           deze daar al in voorkomt.

           De clubnaam staat namelijk al
           op de regel erboven.
        */


        if (

            org &&

            org.name

        ) {


            const club =

                schoon(

                    org.name

                );


            if (

                naam

                    .toLowerCase()

                    .startsWith(

                        club.toLowerCase()

                    )

            ) {


                naam =

                    naam

                        .substring(

                            club.length

                        )

                        .trim();

            }

        }


        return naam;

    }



    /* =====================================================
       TEAMVAK
       ===================================================== */


    function teamVak(

        match,

        thuis

    ) {


        const positie =

            thuis

                ? "vk-home"

                : "vk-away";


        const vikingsClass =

            isVikings(

                match,

                thuis

            )

                ? " vk-vikings"

                : "";


        return (

            '<div class="vk-team ' +

            positie +

            vikingsClass +

            '">' +


                '<div class="vk-org">' +

                    clubNaam(

                        match,

                        thuis

                    ) +

                '</div>' +


                '<div class="vk-team-name">' +

                    teamNaam(

                        match,

                        thuis

                    ) +

                '</div>' +


            '</div>'

        );

    }



    /* =====================================================
       WEDSTRIJDREGEL
       ===================================================== */


    function wedstrijdRegel(

        match

    ) {


        return (

            '<div class="vk-match">' +


                teamVak(

                    match,

                    true

                ) +


                '<div class="vk-score">' +


                    '<span class="vk-home-score">' +

                        match.homeScore +

                    '</span>' +


                    '<span class="vk-dash">' +

                        '-' +

                    '</span>' +


                    '<span class="vk-away-score">' +

                        match.awayScore +

                    '</span>' +


                '</div>' +


                teamVak(

                    match,

                    false

                ) +


            '</div>'

        );

    }



    /* =====================================================
       WEDSTRIJDMOMENT
       ===================================================== */


    function wedstrijdMoment(

        match

    ) {


        if (

            !match.date

        ) {


            return 0;

        }


        /*
           FOYS geeft de datum bijvoorbeeld als:

           2026-09-12T00:00:00Z

           We gebruiken alleen het datumdeel.
        */


        const datum =

            String(

                match.date

            )

            .substring(

                0,

                10

            );


        /*
           De starttijd wordt apart door
           FOYS aangeleverd.
        */


        const tijd =

            match.startTime ||

            "00:00:00";


        /*
           Datum en tijd combineren.

           Voor de volgorde is dit voldoende.
        */


        const moment =

            new Date(

                datum +

                "T" +

                tijd

            );


        const waarde =

            moment.getTime();


        return isNaN(

            waarde

        )

            ? 0

            : waarde;

    }



    /* =====================================================
       CONTROLEREN OF EEN SCORE AANWEZIG IS
       ===================================================== */


    function heeftScore(

        match

    ) {


        /*
           Dit is bewust NIET gekoppeld aan:

           status === "Final"

           We hebben vastgesteld dat FOYS
           bijvoorbeeld een wedstrijd al als:

           26 - 27

           terug kan geven terwijl status nog:

           Planned

           is.

           Zodra beide scores aanwezig zijn,
           beschouwen we de wedstrijd daarom
           als gespeeld.
        */


        return (

            match.homeScore !== null

            &&

            match.homeScore !== undefined

            &&

            match.awayScore !== null

            &&

            match.awayScore !== undefined

        );

    }



    /* =====================================================
       FOYS OPHALEN
       ===================================================== */


    async function laadUitslagen() {


        const resultaten =

            document.getElementById(

                "vk-results"

            );


        try {


            const parameters =

                new URLSearchParams();



            /*
               Wedstrijden tot en met vandaag.
            */


            parameters.set(

                "endDate",

                vandaag()

            );



            /*
               Alleen wedstrijden waarbij
               BV Vikings betrokken is.
            */


            parameters.set(

                "organisationId",

                CLUB_ID

            );



            parameters.set(

                "skipCount",

                "0"

            );



            /*
               We halen maximaal 100 wedstrijden
               op en bepalen vervolgens zelf
               welke vijf uitslagen het meest
               recent zijn.
            */


            parameters.set(

                "maxResultCount",

                "100"

            );



            parameters.set(

                "sorting",

                "date desc, startTime desc"

            );



            /*
               Unieke parameter per aanvraag.

               Hierdoor voorkomen we zoveel
               mogelijk dat browser, proxy of
               signage-player een oude response
               uit cache gebruikt.
            */


            parameters.set(

                "_refresh",

                Date.now().toString()

            );



            const url =

                API +

                "?" +

                parameters.toString();



            const response =

                await fetch(

                    url,

                    {

                        method:
                            "GET",


                        cache:
                            "no-store",


                        headers: {

                            "X-Federationid":
                                FEDERATION_ID

                        }

                    }

                );



            if (

                !response.ok

            ) {


                throw new Error(

                    "HTTP " +

                    response.status

                );

            }



            const data =

                await response.json();



            /* =================================================
               LAATSTE VIJF UITSLAGEN BEPALEN
               ================================================= */


            const wedstrijden =

                (

                    data.items ||

                    []

                )


                /* ---------------------------------------------
                   Alleen Vikings-wedstrijden met score
                   --------------------------------------------- */


                .filter(

                    function (

                        match

                    ) {


                        const isVikingsWedstrijd =

                            isVikings(

                                match,

                                true

                            )

                            ||

                            isVikings(

                                match,

                                false

                            );


                        return (

                            isVikingsWedstrijd

                            &&

                            heeftScore(

                                match

                            )

                        );

                    }

                )



                /* ---------------------------------------------
                   Nieuwste eerst
                   --------------------------------------------- */


                .sort(

                    function (

                        a,

                        b

                    ) {


                        return (

                            wedstrijdMoment(

                                b

                            )

                            -

                            wedstrijdMoment(

                                a

                            )

                        );

                    }

                )



                /* ---------------------------------------------
                   Alleen laatste vijf
                   --------------------------------------------- */


                .slice(

                    0,

                    5

                );



            /* =================================================
               GEEN UITSLAGEN
               ================================================= */


            if (

                wedstrijden.length ===

                0

            ) {


                resultaten.innerHTML =

                    '<div class="vk-message">' +

                    'Geen recente uitslagen beschikbaar' +

                    '</div>';


                return;

            }



            /* =================================================
               RESULTATEN TONEN
               ================================================= */


            resultaten.innerHTML =

                wedstrijden

                    .map(

                        wedstrijdRegel

                    )

                    .join("");



            /* =================================================
               UPDATE-TIJD
               ================================================= */


            const tijd =

                new Date()

                    .toLocaleTimeString(

                        "nl-NL",

                        {

                            timeZone:

                                "Europe/Amsterdam",


                            hour:

                                "2-digit",


                            minute:

                                "2-digit"

                        }

                    );



            const bijgewerkt =

                document.getElementById(

                    "vk-updated"

                );



            if (

                bijgewerkt

            ) {


                bijgewerkt.textContent =

                    "Laatste controle: " +

                    tijd +

                    " · iedere 15 minuten";

            }



            /* =================================================
               DEBUG-INFORMATIE
               ================================================= */


            console.log(

                "FOYS totaal ontvangen:",

                data.items

                    ? data.items.length

                    : 0

            );


            console.log(

                "Laatste vijf Vikings uitslagen:",

                wedstrijden

            );



        } catch (

            fout

        ) {


            console.error(

                "FOYS fout:",

                fout

            );


            resultaten.innerHTML =

                '<div class="vk-message">' +

                'Uitslagen konden niet worden geladen' +

                '</div>';

        }

    }



    /* =====================================================
       DIRECT BIJ OPENEN CONTROLEREN
       ===================================================== */


    laadUitslagen();



    /* =====================================================
       IEDERE 15 MINUTEN CONTROLEREN
       ===================================================== */


    setInterval(

        laadUitslagen,

        UPDATE_INTERVAL

    );



    /* =====================================================
       OOK CONTROLEREN ALS PAGINA WEER ACTIEF WORDT
       ===================================================== */


    document.addEventListener(

        "visibilitychange",

        function () {


            if (

                document.visibilityState ===

                "visible"

            ) {


                laadUitslagen();

            }

        }

    );


})();

</script>


</body>

</html>
