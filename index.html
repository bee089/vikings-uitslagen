<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vikings Hardenberg - Uitslagen</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#001f4c;font-family:Arial,Helvetica,sans-serif}#vikings-screen{position:fixed;inset:0;width:100vw;height:100vh;background-image:url("Uitslagen%20sjabloon.png");background-size:cover;background-position:center;background-repeat:no-repeat;color:#fff}#vk-results{position:absolute;left:22%;right:22%;top:54%;bottom:13%;display:grid;grid-template-rows:repeat(5,1fr);gap:.7vh}.vk-match{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 12vw minmax(0,1fr);column-gap:1.7vw;align-items:center;padding:0 1.8vw;background:rgba(0,25,65,.76);border:1px solid rgba(255,255,255,.14);border-radius:.7vh}.vk-team{min-width:0;display:flex;flex-direction:column;justify-content:center}.vk-home{align-items:flex-end;text-align:right}.vk-away{align-items:flex-start;text-align:left}.vk-org{width:100%;margin-bottom:.33vh;color:rgba(255,255,255,.65);font-size:1.37vh;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vk-team-name{width:100%;font-size:2.6vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vk-vikings .vk-org{color:rgba(255,211,0,.82)}.vk-vikings .vk-team-name{color:#ffd300;font-weight:900}.vk-score{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.04vh .65vw;background:linear-gradient(135deg,rgba(0,86,190,.95),rgba(0,145,225,.9));border-radius:.78vh;font-size:3.25vh;font-weight:900}.vk-home-score{text-align:right}.vk-away-score{text-align:left}.vk-dash{padding:0 .78vw;color:#ffd300}#vk-updated{position:absolute;right:2.5%;bottom:1.4%;color:rgba(255,255,255,.48);font-size:.9vh}.vk-message{grid-row:1/6;display:flex;align-items:center;justify-content:center;font-size:2.6vh;font-weight:700;background:rgba(0,25,65,.55);border-radius:1vh}</style></head>
<body><div id="vikings-screen"><div id="vk-results"><div class="vk-message">Uitslagen laden...</div></div><div id="vk-updated"></div></div>
<script>(function(){const CLUB_ID="b096fce6-238c-4f01-8cb9-1ef2fe6e47a0",FEDERATION_ID="52cfa65e-9782-4a81-ab35-e2f981fcb7a9",API="https://api.foys.io/competition/public-api/v1/matches",UPDATE_INTERVAL=15*60*1000;function vandaag(){const d=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Amsterdam",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),o={};d.forEach(x=>o[x.type]=x.value);return o.year+"-"+o.month+"-"+o.day}function schoon(t){return(t||"").replace(/\*+/g,"").trim()}function organisatie(m,t){return t?m.homeOrganisation:m.awayOrganisation}function isVikings(m,t){const o=organisatie(m,t);return!!(o&&o.id===CLUB_ID)}function clubNaam(m,t){const o=organisatie(m,t);if(isVikings(m,t))return"BV VIKINGS HARDENBERG";return o&&o.name?schoon(o.name):""}function teamNaam(m,t){let n=schoon(t?m.homeTeamName:m.awayTeamName),o=organisatie(m,t);if(isVikings(m,t))return n.replace(/^BV Vikings\s*/i,"");if(o&&o.name){const c=schoon(o.name);if(n.toLowerCase().startsWith(c.toLowerCase()))n=n.substring(c.length).trim()}return n}function teamVak(m,t){return'<div class="vk-team '+(t?'vk-home':'vk-away')+(isVikings(m,t)?' vk-vikings':'')+'"><div class="vk-org">'+clubNaam(m,t)+'</div><div class="vk-team-name">'+teamNaam(m,t)+'</div></div>'}function wedstrijdRegel(m){return'<div class="vk-match">'+teamVak(m,true)+'<div class="vk-score"><span class="vk-home-score">'+m.homeScore+'</span><span class="vk-dash">-</span><span class="vk-away-score">'+m.awayScore+'</span></div>'+teamVak(m,false)+'</div>'}function moment(m){if(!m.date)return 0;const v=new Date(String(m.date).substring(0,10)+'T'+(m.startTime||'00:00:00')).getTime();return isNaN(v)?0:v}function heeftScore(m){return m.homeScore!=null&&m.awayScore!=null}function isDefinitief(m){return String(m.status||'').trim().toLowerCase()==='final'}function updateTijd(){const e=document.getElementById('vk-updated');if(e)e.textContent='FOYS '+new Date().toLocaleTimeString('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'})+' · 15 min'}async function laad(){const r=document.getElementById('vk-results');try{const p=new URLSearchParams({endDate:vandaag(),organisationId:CLUB_ID,skipCount:'0',maxResultCount:'100',sorting:'date desc, startTime desc',_refresh:Date.now().toString()});const res=await fetch(API+'?'+p.toString(),{method:'GET',cache:'no-store',headers:{'X-Federationid':FEDERATION_ID}});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json(),w=(data.items||[]).filter(m=>(isVikings(m,true)||isVikings(m,false))&&isDefinitief(m)&&heeftScore(m)).sort((a,b)=>moment(b)-moment(a)).slice(0,5);r.innerHTML=w.length?w.map(wedstrijdRegel).join(''):'<div class="vk-message">Geen recente uitslagen beschikbaar</div>';updateTijd()}catch(e){console.error('FOYS fout:',e);if(r.querySelector('.vk-message'))r.innerHTML='<div class="vk-message">Uitslagen konden niet worden geladen</div>'}}laad();setInterval(laad,UPDATE_INTERVAL);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')laad()})})();</script></body></html>
